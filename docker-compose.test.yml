# Local cloud emulators for AresaDB integration tests.
#
# Spins up MinIO (S3-compatible) and fake-gcs-server (GCS-compatible)
# so the `cloud_*` test suites can run without real cloud credentials.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   # ...
#   docker compose -f docker-compose.test.yml down -v
#
# Endpoints:
#   MinIO:           http://localhost:9000 (console on :9001)
#   fake-gcs-server: http://localhost:4443
#
# The `./scripts/start_emulators.sh` and `./scripts/stop_emulators.sh`
# wrappers drive this file and pre-create the default test buckets.

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aresadb-test
      MINIO_ROOT_PASSWORD: aresadb-test-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio-setup:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 aresadb-test aresadb-test-secret && mc mb --ignore-existing local/aresadb-tests && mc anonymous set public local/aresadb-tests

  fake-gcs:
    image: fsouza/fake-gcs-server:1.54.0
    command: >
      -scheme http
      -port 4443
      -public-host localhost:4443
      -external-url http://localhost:4443
      -backend memory
    ports:
      - "4443:4443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4443/storage/v1/b"]
      interval: 2s
      timeout: 5s
      retries: 20

  fake-gcs-setup:
    image: curlimages/curl:8.11.0
    depends_on:
      fake-gcs:
        condition: service_healthy
    # `>-` folds newlines into spaces and strips the trailing newline.
    # Keep the curl invocation on a single physical line so the shell
    # sees `-H` / `-d` as distinct arguments (older attempts used
    # backslash continuations which leaked into argv as literal `\`).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        curl -s -X POST 'http://fake-gcs:4443/storage/v1/b?project=aresadb-tests' -H 'Content-Type: application/json' -d '{"name":"aresadb-tests"}' || true
