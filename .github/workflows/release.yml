name: Release

# Tag pushes run the full release fan-out (crates.io, PyPI, Docker).
# `workflow_dispatch` is a manual escape hatch for re-running the
# Docker image publish against a specific version — used when the
# tag-triggered run couldn't complete the Docker leg and we don't
# want to re-publish to crates.io / PyPI.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the Docker image as (without leading v)"
        required: true
        type: string
      docker_only:
        description: "Only run the Docker publish job (skip crates.io + PyPI)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Crates.io ──────────────────────────────────────────────────
  publish-crate:
    name: Publish to crates.io
    if: github.event_name == 'push' || github.event.inputs.docker_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish (skip if version already exists)
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} || echo "Version already published, skipping"

  # ── PyPI wheels (Linux via manylinux container) ────────────────
  build-wheels-linux:
    name: Build wheels (linux-${{ matrix.target }})
    if: github.event_name == 'push' || github.event.inputs.docker_only == 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin
      - name: Build wheels for all Python versions
        working-directory: python
        run: |
          maturin build --release --target ${{ matrix.target }}-unknown-linux-gnu \
            --find-interpreter --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: python/dist/*.whl

  # ── PyPI wheels (macOS) ────────────────────────────────────────
  build-wheels-macos:
    name: Build wheels (macos-${{ matrix.target }})
    if: github.event_name == 'push' || github.event.inputs.docker_only == 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13
      - run: pip install maturin
      - name: Build wheels for Python 3.9-3.13
        working-directory: python
        run: |
          maturin build --release --target ${{ matrix.target }} \
            --interpreter python3.9 python3.10 python3.11 python3.12 python3.13 \
            --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: python/dist/*.whl

  # ── Source distribution ────────────────────────────────────────
  build-sdist:
    name: Build source distribution
    if: github.event_name == 'push' || github.event.inputs.docker_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin
      - name: Build sdist
        working-directory: python
        run: maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  # ── Publish to PyPI ────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' || github.event.inputs.docker_only == 'false'
    needs: [build-wheels-linux, build-wheels-macos, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aresadb
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ── Docker (GHCR) ─────────────────────────────────────────────
  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: meta
        run: |
          # On tag push, derive from the ref. On workflow_dispatch,
          # use the explicit `version` input (no leading `v`).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cluster/Dockerfile
          push: true
          tags: |
            ghcr.io/yoreai/aresadb/cluster:${{ steps.meta.outputs.version }}
            ghcr.io/yoreai/aresadb/cluster:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
