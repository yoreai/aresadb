[package]
name = "aresadb-pd"
version = "2.0.0-alpha.2"
edition = "2021"
authors = ["Yevheniy Chuba <yevheniyc@gmail.com>"]
description = "Placement driver catalog for AresaDB v2 — range descriptors, splits, merges, membership"
license = "MIT"
repository = "https://github.com/yoreai/aresadb"
readme = "README.md"
publish = false

[lib]
name = "aresadb_pd"
path = "src/lib.rs"

[dependencies]
aresadb-core = { path = "../aresadb-core" }
aresadb-raft = { path = "../aresadb-raft" }

anyhow.workspace = true
async-trait.workspace = true
bincode.workspace = true
bytes.workspace = true
futures.workspace = true
openraft.workspace = true
parking_lot.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true

[build-dependencies]
tonic-build.workspace = true
protoc-bin-vendored = "3.1"

[dev-dependencies]
aresadb-engine-redb = { path = "../aresadb-engine-redb" }
tempfile = "3.9"
tokio = { workspace = true }
