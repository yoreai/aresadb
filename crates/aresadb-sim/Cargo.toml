[package]
name = "aresadb-sim"
version = "2.0.0-alpha.2"
edition = "2021"
authors = ["Yevheniy Chuba <yevheniyc@gmail.com>"]
description = "Deterministic-simulation test harness for AresaDB distributed scenarios"
license = "MIT"
repository = "https://github.com/yoreai/aresadb"
publish = false
rust-version = "1.85"

[lib]
name = "aresadb_sim"
path = "src/lib.rs"

[dependencies]
aresadb-core = { path = "../aresadb-core" }
aresadb-raft = { path = "../aresadb-raft" }
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.5"
futures = "0.3"
tracing = "0.1"

# madsim provides the deterministic-simulation tokio replacement used
# by cluster scenario tests. When built with `--cfg madsim`, tokio
# primitives are swapped for their deterministic equivalents.
madsim = "0.2"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
