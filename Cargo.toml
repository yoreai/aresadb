[workspace]
# Workspace members for the v2 distributed architecture. The root package
# (this Cargo.toml) remains the main `aresadb` crate for backward compat;
# new layers land as sibling crates in `crates/`. See
# `docs/architecture-v2.md` for the full layout plan.
#
# `python/` is intentionally NOT a workspace member so the pyo3
# extension-module linkage doesn't leak into every `cargo build`.
# It's still tied to the root crate via `path = ".."` and gets its
# own Cargo.lock when built with maturin.
members = [
    "crates/aresadb-core",
    "crates/aresadb-engine-redb",
    "crates/aresadb-engine-lsm",
    "crates/aresadb-raft",
    "crates/aresadb-net",
    "crates/aresadb-cluster",
    "crates/aresadb-pd",
    "crates/aresadb-sim",
]
exclude = ["python"]

# Workspace-wide dependency versions used by the new v2 crates. The
# root `aresadb` crate still pins its own versions above for backward
# compatibility; v2 crates should consume these via
# `openraft.workspace = true` etc.
[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
bytes = { version = "1.5", features = ["serde"] }
futures = "0.3"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tracing = "0.1"
tokio = { version = "1.35", features = ["full", "parking_lot"] }
openraft = { version = "0.9.22", features = ["serde", "storage-v2", "tracing-log"] }

# Networking (Phase 1b+): tonic gRPC transport + prost protobuf
# runtime. Versions are centralised here so `aresadb-net`,
# `aresadb-cluster`, and future transport layers stay in lock-step.
tonic = "0.11"
tonic-build = "0.11"
prost = "0.12"
prost-types = "0.12"

# Durable backends (Phase 1c+): embedded ACID store used by default
# for both the Raft log and state machine data.
redb = "2.0"

# LSM backend (Phase 2d+): fjall is the "write-heavy workload" engine
# — a log-structured merge tree over journal + memtable + levelled
# SSTables. Pinned to 3.1.x; 3.x's `Database::builder(path).open()` API
# is stable, and the workspace's Rust 1.95 toolchain clears fjall's
# 1.90 MSRV comfortably. Enabled via `bytes_1` so fjall's `UserKey` /
# `UserValue` types are `bytes::Bytes` directly — same slice type
# `aresadb-core` already uses, so we don't have to copy across the
# backend boundary.
fjall = { version = "3.1", features = ["bytes_1"] }

# CLI + admin tooling (Phase 1c): clap for the admin binary, serde_json
# for human-readable cluster status dumps.
clap = { version = "4.4", features = ["derive", "env"] }
serde_json = "1.0"

[package]
name = "aresadb"
version = "2.0.0-alpha.2"
edition = "2021"
authors = ["Yevheniy Chuba <yevheniyc@gmail.com>"]
description = "High-performance multi-model database engine — KV, Graph, SQL, Vector Search, and Full-Text Search in one binary"
license = "MIT"
repository = "https://github.com/yoreai/aresadb"
homepage = "https://github.com/yoreai/aresadb"
readme = "README.md"
keywords = ["database", "graph", "vector-search", "full-text-search", "embedded"]
categories = ["database", "command-line-utilities"]
rust-version = "1.90"

[lib]
name = "aresadb"
path = "src/lib.rs"

[[bin]]
name = "aresadb"
path = "src/main.rs"

[[bin]]
name = "aresadb-server"
path = "src/bin/server.rs"
required-features = ["server"]

[features]
default = []
server = ["distributed"]
distributed = []
full = ["server", "distributed"]

[dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rkyv = { version = "0.7", features = ["validation"] }
bincode = "1.3"

# Storage
redb = "2.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Cloud storage
object_store = { version = "0.9", features = ["aws", "gcp"] }
bytes = "1.5"
url = "2.5"

# Caching
moka = { version = "0.12", features = ["sync"] }

# Query engine
sqlparser = "0.43"
regex = "1.10"
petgraph = "0.6"

# Async runtime
tokio = { version = "1.35", features = ["full", "parking_lot"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"

# Concurrency
parking_lot = "0.12"
crossbeam = "0.8"
dashmap = "5.5"

# CLI
clap = { version = "4.4", features = ["derive"] }
rustyline = "13.0"
syntect = "5.0"
tabled = "0.14"
colored = "2.0"
indicatif = "0.17"
humansize = "2.1"
walkdir = "2.4"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# V2: Distributed features
lz4_flex = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
siphasher = "1.0"
crc32fast = "1.3"
rand = "0.8"

# HTTP client (for fetching remote data)
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
tempfile = "3.9"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
proptest = "1.4"
test-case = "3.3"
tokio-test = "0.4"
pretty_assertions = "1.4"
mockall = "0.12"
fake = { version = "2.9", features = ["derive"] }
quickcheck = "1.0"
quickcheck_macros = "1.0"
rstest = "0.18"
serial_test = "3.0"
tracing-test = "0.2"

# v2 distributed crates — dev-only so the release build of the root
# v1 `aresadb` binary stays unchanged. These are wired in solely so
# `benches/v2_cluster_bench.rs` can measure the alpha.2 stack
# (StorageBackend impls + Raft apply loop) side-by-side with the
# legacy v0.2-era `distributed_bench`. See
# `docs/publishing-audit.md` for how this slots into the
# v2 benchmarking plan.
aresadb-core = { path = "crates/aresadb-core" }
aresadb-raft = { path = "crates/aresadb-raft" }
aresadb-engine-redb = { path = "crates/aresadb-engine-redb" }
aresadb-engine-lsm = { path = "crates/aresadb-engine-lsm" }

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "query_bench"
harness = false

[[bench]]
name = "distributed_bench"
harness = false

[[bench]]
name = "v2_cluster_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = false

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
debug = true

[[example]]
name = "fire_safety_test"
path = "examples/fire_safety_test.rs"

[[example]]
name = "tiered_storage_demo"
path = "examples/tiered_storage_demo.rs"

[[example]]
name = "benchmark_suite"
path = "benchmarks/run_benchmarks.rs"
